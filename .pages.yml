media:
  input: media
  output: /media

content:
  - name: website
    label: Website Settings
    type: file
    path: site.json
    fields:
      - name: brand
        label: Business Name
        type: string

      - name: tagline
        label: Tagline
        type: string

      - name: description
        label: Description
        type: text

      - name: phone
        label: Phone Number
        type: string

      - name: whatsapp
        label: WhatsApp Number
        type: string

      - name: email
        label: Email
        type: string

      - name: city
        label: Location
        type: string

      - name: instagram
        label: Instagram
        type: string

      - name: hero_image
        label: Homepage Image
        type: image

      - name: about_image
        label: About Us Image
        type: image

      - name: services
        label: Services
        type: object
        list: true
        fields:
          - name: number
            type: string
          - name: title
            type: string
          - name: description
            type: text
